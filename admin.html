<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - BlazeTopia Shop</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-container { max-width: 900px; margin: 2rem auto; padding: 1rem; }
    .admin-card { background: rgba(255,255,255,0.03); border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.05); }
    .admin-card h3 { color: #fff; margin-bottom: 0.5rem; }
    .admin-card p { color: rgba(255,255,255,0.6); font-size: 0.85rem; }
    .admin-card .status { display: inline-block; padding: 0.2rem 0.8rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.75rem; }
    .status-pending { background: #f59e0b; color: #000; }
    .status-success { background: #22c55e; color: #000; }
    .status-rejected { background: #ef4444; color: #fff; }
    .btn-approve { padding: 0.4rem 1.2rem; background: #22c55e; color: #000; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; margin-right: 0.5rem; }
    .btn-approve:hover { background: #16a34a; }
    .btn-reject { padding: 0.4rem 1.2rem; background: #ef4444; color: #fff; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; margin-right: 0.5rem; }
    .btn-reject:hover { background: #dc2626; }
    .btn-delete { padding: 0.4rem 1.2rem; background: #6b7280; color: #fff; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; }
    .btn-delete:hover { background: #4b5563; }
    .no-orders { color: rgba(255,255,255,0.4); text-align: center; padding: 2rem; }
    .admin-proof { max-width: 150px; max-height: 120px; border-radius: 0.5rem; margin-top: 0.5rem; border: 1px solid rgba(255,255,255,0.05); }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .admin-login { max-width: 400px; margin: 0 auto; padding: 2rem; background: rgba(255,255,255,0.03); border-radius: 1rem; }
    .admin-login input { width: 100%; padding: 0.6rem; margin-bottom: 1rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.03); color: #fff; }
    .admin-login button { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #f97316, #ea580c); border: none; border-radius: 0.75rem; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="admin-container">
    <h1 style="color: #fff; margin-bottom: 1.5rem;"><i class="fas fa-user-shield"></i> Panel Admin</h1>
    
    <div id="adminLogin" class="admin-login">
      <h3 style="color: #fff; margin-bottom: 1rem;">Login Admin</h3>
      <input type="email" id="adminEmail" placeholder="Email admin" />
      <input type="password" id="adminPassword" placeholder="Password" />
      <button onclick="adminLogin()">Login</button>
    </div>

    <div id="ordersList" style="display:none;"></div>
  </div>

  <script>
    // ============================================================
    // SUPABASE CONFIG
    // ============================================================
    const SUPABASE_URL = 'https://tiloslwfdfepcofmtros.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpbG9zbHdmZGZlcGNvZm10cm9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NDI2NjYsImV4cCI6MjEwMTAxODY2Nn0.oCySVoTjzcLb7EtYs9cLntNdZLCIxoq2IiAR5gILJ_w';
    let supabaseClient = null;
    let supabaseReady = false;

    function initSupabase() {
      try {
        if (typeof window.supabase !== 'undefined') {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          supabaseReady = true;
          console.log('✅ Admin: Supabase connected!');
          // Auto-check session
          supabaseClient.auth.getSession().then(({ data }) => {
            if (data.session) {
              document.getElementById('adminLogin').style.display = 'none';
              document.getElementById('ordersList').style.display = 'block';
              renderAdmin();
            }
          });
        } else {
          setTimeout(initSupabase, 1000);
        }
      } catch (e) {
        console.error('❌ Admin Supabase error:', e);
        setTimeout(initSupabase, 2000);
      }
    }

    async function adminLogin() {
      if (!supabaseReady) {
        alert('⚠️ Database belum siap. Coba refresh halaman.');
        return;
      }
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;
      
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert('❌ Login gagal: ' + error.message);
      } else {
        document.getElementById('adminLogin').style.display = 'none';
        document.getElementById('ordersList').style.display = 'block';
        renderAdmin();
      }
    }

    async function renderAdmin() {
      if (!supabaseReady) return;
      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .order('timestamp', { ascending: false });

      if (error) {
        console.error('Gagal load orders:', error);
        return;
      }

      const container = document.getElementById('ordersList');
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="no-orders">Belum ada pesanan.</div>';
        return;
      }

      container.innerHTML = data.map(order => `
        <div class="admin-card">
          <h3>${order.item} - ${order.price}</h3>
          <p><strong>GrowID:</strong> ${order.growId} | <strong>World:</strong> ${order.worldName}</p>
          <p><strong>Email:</strong> ${order.email || 'Tidak ada'} | <strong>User:</strong> ${order.username || 'Tidak ada'}</p>
          <p><strong>Waktu:</strong> ${new Date(order.timestamp).toLocaleString('id-ID')}</p>
          <p><strong>Status:</strong> <span class="status ${order.status === 'success' ? 'status-success' : order.status === 'rejected' ? 'status-rejected' : 'status-pending'}">${order.status === 'success' ? '✅ Disetujui' : order.status === 'rejected' ? '❌ Ditolak' : '⏳ Menunggu'}</span></p>
          ${order.proofUrl ? `<img src="${order.proofUrl}" alt="Bukti" class="admin-proof" />` : '<p style="color: rgba(255,255,255,0.3); font-size: 0.75rem;">Belum upload bukti</p>'}
          <div class="actions">
            ${order.status === 'pending' ? `
              <button class="btn-approve" onclick="approveOrder('${order.id}')"><i class="fas fa-check"></i> Setujui</button>
              <button class="btn-reject" onclick="rejectOrder('${order.id}')"><i class="fas fa-times"></i> Tolak</button>
            ` : ''}
            <button class="btn-delete" onclick="deleteOrder('${order.id}')"><i class="fas fa-trash"></i> Hapus</button>
          </div>
        </div>
      `).join('');
    }

    async function approveOrder(orderId) {
      if (!supabaseReady) return;
      const { error } = await supabaseClient
        .from('orders')
        .update({ status: 'success' })
        .eq('id', orderId);

      if (error) {
        alert('❌ Gagal: ' + error.message);
      } else {
        alert('✅ Pesanan disetujui!');
        renderAdmin();
      }
    }

    async function rejectOrder(orderId) {
      if (!supabaseReady) return;
      const { error } = await supabaseClient
        .from('orders')
        .update({ status: 'rejected' })
        .eq('id', orderId);

      if (error) {
        alert('❌ Gagal: ' + error.message);
      } else {
        alert('❌ Pesanan ditolak!');
        renderAdmin();
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm('Yakin ingin menghapus pesanan ini?')) return;
      if (!supabaseReady) return;
      
      const { error } = await supabaseClient
        .from('orders')
        .delete()
        .eq('id', orderId);

      if (error) {
        alert('❌ Gagal: ' + error.message);
      } else {
        alert('🗑️ Pesanan dihapus!');
        renderAdmin();
      }
    }

    // Auth state listener
    if (typeof window.supabase !== 'undefined') {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      client.auth.onAuthStateChange((event, session) => {
        if (session?.user) {
          document.getElementById('adminLogin').style.display = 'none';
          document.getElementById('ordersList').style.display = 'block';
          renderAdmin();
        }
      });
    }

    // Init
    initSupabase();
  </script>
</body>
  </html>
